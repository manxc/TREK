services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${TREK_IMAGE_TAG:-3.4.1-family-zh-en-baidu.1}
    image: trek-family:${TREK_IMAGE_TAG:-3.4.1-family-zh-en-baidu.1}
    container_name: trek-family
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    ports:
      - "127.0.0.1:${TREK_LOCAL_PORT:-3030}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      TZ: Asia/Shanghai
      LOG_LEVEL: info
      DEFAULT_LANGUAGE: zh
      APP_URL: ${APP_URL:-https://trek.jiqiao.ai}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://trek.jiqiao.ai,https://trek.xinyi.dev}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-trek.jiqiao.ai}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-https://trek.jiqiao.ai}
      FORCE_HTTPS: "true"
      TRUST_PROXY: "1"
      HSTS_INCLUDE_SUBDOMAINS: "false"
      ALLOW_INTERNAL_NETWORK: "false"
      SESSION_DURATION: 24h
      SESSION_DURATION_REMEMBER: 30d
      TREK_PLUGINS_ENABLED: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    volumes:
      - trek_data:/app/data
      - trek_uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    container_name: trek-family-tunnel
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - --url
      - http://app:3000
      - --credentials-file
      - /run/secrets/tunnel-credentials.json
      - run
      - ${CLOUDFLARED_TUNNEL_ID:?Set CLOUDFLARED_TUNNEL_ID}
    depends_on:
      app:
        condition: service_healthy
    secrets:
      - source: tunnel_credentials
        target: tunnel-credentials.json
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  trek_data:
    name: trek-family-data
  trek_uploads:
    name: trek-family-uploads

secrets:
  tunnel_credentials:
    file: ${CLOUDFLARED_CREDENTIALS_FILE:?Set CLOUDFLARED_CREDENTIALS_FILE}
